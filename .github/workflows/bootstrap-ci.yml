name: bootstrap-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository validator when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/validate_repo.py ]]; then
            python3 tools/validate_repo.py
          fi
      - name: Syntax-check shell tools when present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(tools/*.sh)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Parse workflow graph when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs/workflow.json ]]; then
            python3 -m json.tool docs/workflow.json >/dev/null
          fi

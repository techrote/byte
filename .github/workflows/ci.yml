name: repository-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'remote/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate RAG pack and workflow graph
        run: python3 tools/validate_repo.py

      - name: Syntax-check shell tools
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(tools/*.sh remote/*.sh)
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Confirm workflow JSON parses independently
        run: python3 -m json.tool docs/workflow.json >/dev/null

  appbox-remote:
    name: appbox-remote-smoke
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'remote/')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BYTE_HOST: ${{ secrets.BYTE_HOST }}
      BYTE_USER: ${{ secrets.BYTE_USER }}
      BYTE_SSH_KEY: ${{ secrets.BYTE_SSH_KEY }}
      BYTE_KNOWN_HOSTS: ${{ secrets.BYTE_KNOWN_HOSTS }}
      EXPECTED_HOST_FINGERPRINT: SHA256:/+RRBhGd7lNUsOiahgXDZc3K7EHCEIrike7ZzLYN8RI
      EXPECTED_CLIENT_FINGERPRINT: SHA256:jk35WC40b/+tQLNlHMwAh7cTFtgJI5WO1r+HfQd5iyI
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate remote execution secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in BYTE_HOST BYTE_USER BYTE_SSH_KEY BYTE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret $name is not available" >&2
              exit 1
            fi
          done
          echo "::add-mask::$BYTE_HOST"
          echo "::add-mask::$BYTE_USER"

      - name: Configure and verify pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BYTE_SSH_KEY" > "$HOME/.ssh/byte_agent"
          chmod 600 "$HOME/.ssh/byte_agent"
          printf '%s\n' "$BYTE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          host_actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '/ED25519/ {print $2; exit}')
          if [[ "$host_actual" != "$EXPECTED_HOST_FINGERPRINT" ]]; then
            echo "Pinned known-host fingerprint mismatch" >&2
            exit 1
          fi
          echo "Pinned ED25519 host fingerprint verified"

          ssh-keygen -y -f "$HOME/.ssh/byte_agent" > "$HOME/.ssh/byte_agent.pub"
          client_actual=$(ssh-keygen -lf "$HOME/.ssh/byte_agent.pub" -E sha256 | awk '{print $2; exit}')
          if [[ "$client_actual" != "$EXPECTED_CLIENT_FINGERPRINT" ]]; then
            echo "Actions private key does not match installed automation public key" >&2
            echo "Observed client fingerprint: $client_actual" >&2
            exit 1
          fi
          echo "Automation client-key fingerprint verified"

      - name: Execute bounded storage qualification and concurrent SSH ping
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/byte_agent"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          remote="$BYTE_USER@$BYTE_HOST"
          remote_log="$RUNNER_TEMP/p1-03-remote.log"

          tar -cf - remote/task.sh tools/qualify_storage.sh | \
            ssh "${ssh_opts[@]}" "$remote" \
              'set -eu; tmp=$(mktemp -d /tmp/byte-remote.XXXXXX); trap '\''rm -rf "$tmp"'\'' EXIT HUP INT TERM; tar -xf - -C "$tmp"; timeout 600 bash "$tmp/remote/task.sh"' \
              >"$remote_log" 2>&1 &
          remote_pid=$!

          marker_ready=no
          for _ in $(seq 1 20); do
            if ssh "${ssh_opts[@]}" "$remote" 'test -f "$HOME/.byte-p1-03-running"' 2>/dev/null; then
              marker_ready=yes
              break
            fi
            if ! kill -0 "$remote_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$marker_ready" == yes ]]; then
            sleep 2
            start_ns=$(date +%s%N)
            ping_out=$(ssh "${ssh_opts[@]}" "$remote" 'test -f "$HOME/.byte-p1-03-running" && printf "concurrent_ssh_ping=ok\\n" && date -u +concurrent_ssh_utc=%Y-%m-%dT%H:%M:%SZ')
            end_ns=$(date +%s%N)
            ping_ms=$(( (end_ns - start_ns) / 1000000 ))
            printf '%s\n' "$ping_out"
            printf 'concurrent_ssh_ping_ms=%d\n' "$ping_ms"
          else
            echo 'concurrent_ssh_ping=marker_not_observed'
          fi

          set +e
          wait "$remote_pid"
          remote_rc=$?
          set -e
          cat "$remote_log"
          exit "$remote_rc"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"

name: repository-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'remote/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate RAG pack and workflow graph
        run: python3 tools/validate_repo.py

      - name: Syntax-check shell tools
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(tools/*.sh remote/*.sh)
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Confirm workflow JSON parses independently
        run: python3 -m json.tool docs/workflow.json >/dev/null

  appbox-remote:
    name: appbox-remote-smoke
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'remote/')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BYTE_HOST: ${{ secrets.BYTE_HOST }}
      BYTE_USER: ${{ secrets.BYTE_USER }}
      BYTE_SSH_KEY: ${{ secrets.BYTE_SSH_KEY }}
      BYTE_KNOWN_HOSTS: ${{ secrets.BYTE_KNOWN_HOSTS }}
      EXPECTED_HOST_FINGERPRINT: SHA256:/+RRBhGd7lNUsOiahgXDZc3K7EHCEIrike7ZzLYN8RI
      EXPECTED_CLIENT_FINGERPRINT: SHA256:jk35WC40b/+tQLNlHMwAh7cTFtgJI5WO1r+HfQd5iyI
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate remote execution secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in BYTE_HOST BYTE_USER BYTE_SSH_KEY BYTE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret $name is not available" >&2
              exit 1
            fi
          done
          echo "::add-mask::$BYTE_HOST"
          echo "::add-mask::$BYTE_USER"

      - name: Configure and verify pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BYTE_SSH_KEY" > "$HOME/.ssh/byte_agent"
          chmod 600 "$HOME/.ssh/byte_agent"
          printf '%s\n' "$BYTE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          host_actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '/ED25519/ {print $2; exit}')
          if [[ "$host_actual" != "$EXPECTED_HOST_FINGERPRINT" ]]; then
            echo "Pinned known-host fingerprint mismatch" >&2
            exit 1
          fi
          echo "Pinned ED25519 host fingerprint verified"

          ssh-keygen -y -f "$HOME/.ssh/byte_agent" > "$HOME/.ssh/byte_agent.pub"
          client_actual=$(ssh-keygen -lf "$HOME/.ssh/byte_agent.pub" -E sha256 | awk '{print $2; exit}')
          if [[ "$client_actual" != "$EXPECTED_CLIENT_FINGERPRINT" ]]; then
            echo "Actions private key does not match installed automation public key" >&2
            echo "Observed client fingerprint: $client_actual" >&2
            exit 1
          fi
          echo "Automation client-key fingerprint verified"

      - name: Execute bounded Docker qualification setup
        shell: bash
        run: |
          set -euo pipefail
          test -f remote/task.sh

          set +e
          remote_out=$(
            tar -cf - remote/task.sh | \
              ssh \
                -i "$HOME/.ssh/byte_agent" \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ConnectTimeout=15 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                "$BYTE_USER@$BYTE_HOST" \
                'set -eu; tmp=$(mktemp -d /tmp/byte-remote.XXXXXX); trap '\''rm -rf "$tmp"'\'' EXIT HUP INT TERM; tar -xf - -C "$tmp"; timeout 180 bash "$tmp/remote/task.sh"' \
              2>&1
          )
          remote_rc=$?
          set -e

          public_url=$(printf '%s\n' "$remote_out" | sed -n 's/^public_url=//p' | tail -n 1)
          if [[ -n "$public_url" ]]; then
            echo "::add-mask::$public_url"
            printf '%s' "$public_url" > "$RUNNER_TEMP/byte_p1_02_public_url"
          fi

          printf '%s\n' "$remote_out" | sed -E 's#^public_url=.*#public_url=<redacted>#'

          if [[ "$remote_rc" -ne 0 ]]; then
            echo "Remote qualification setup failed with rc=$remote_rc" >&2
            exit "$remote_rc"
          fi
          if [[ -z "$public_url" ]]; then
            echo 'Remote qualification did not return a managed HTTPS URL' >&2
            exit 1
          fi

      - name: Verify managed HTTPS from outside Appbox
        shell: bash
        run: |
          set -euo pipefail
          url=$(cat "$RUNNER_TEMP/byte_p1_02_public_url")
          echo "::add-mask::$url"
          body="$RUNNER_TEMP/byte_p1_02_https_body"

          for attempt in $(seq 1 18); do
            set +e
            metrics=$(curl \
              --silent --show-error --fail --location \
              --connect-timeout 5 --max-time 12 \
              --output "$body" \
              --write-out 'http=%{http_code} tls_verify=%{ssl_verify_result} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}' \
              "$url" 2>&1)
            curl_rc=$?
            set -e

            if [[ "$curl_rc" -eq 0 ]] && grep -q 'http=200' <<<"$metrics" && grep -q 'tls_verify=0' <<<"$metrics"; then
              echo "external_https=pass attempt=$attempt $metrics"
              test -s "$body"
              echo 'external_https_body=nonempty'
              exit 0
            fi

            echo "external_https_attempt=$attempt result=retry curl_rc=$curl_rc"
            sleep 5
          done

          echo 'external_https=fail' >&2
          exit 1

      - name: Clean exact qualification resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f remote/cleanup.sh
          tar -cf - remote/cleanup.sh | \
            ssh \
              -i "$HOME/.ssh/byte_agent" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              "$BYTE_USER@$BYTE_HOST" \
              'set -eu; tmp=$(mktemp -d /tmp/byte-cleanup.XXXXXX); trap '\''rm -rf "$tmp"'\'' EXIT HUP INT TERM; tar -xf - -C "$tmp"; timeout 120 bash "$tmp/remote/cleanup.sh"'

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
